name: A234 COM comparison (temporary)
on:
  push:
    branches: [claude/chatgpt-a234-hull-recovery]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check prototype/game.js && node tools/test_a234.cjs
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8099 >/tmp/a234-http.log 2>&1 &
          A234_CASE=${{ matrix.case }} node tools/measure_a234.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a234-case-${{ matrix.case }}
          path: a234-results.json
